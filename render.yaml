# Render Blueprint — Axis demo deployment
#
# WHY oregon: Render offers no Canadian region (oregon/ohio/virginia/
# frankfurt/singapore as of 2026-07). Oregon is the closest to BC. This is
# acceptable ONLY while the instance carries fake demo data — real BC
# student data falls under FIPPA and needs Canadian residency (GTM.md §6),
# which means a different host (e.g. AWS ca-central-1) before any pilot.
#
# WHY COOKIE_SAMESITE=none: frontend and backend live on separate
# *.onrender.com subdomains. onrender.com is on the Public Suffix List, so
# the browser treats them as different sites and SameSite=strict cookies
# are never sent back. See auth.controller.ts.
#
# Free-tier caveats (demo-grade, not prod):
# - Free web services sleep after 15 min idle; first request takes ~1 min.
# - Postgres lives on Neon (free plan, AWS us-west-2 Oregon), not Render:
#   Render's free Postgres expires after 30 days, and its expiry (~2026-08-15)
#   took the demo API down. Neon's branch shows "Expires: Never". Neon has no
#   Canadian region either (checked 2026-10-09) — same demo-data-only caveat.
#
# WHY --prod=false on install: NODE_ENV=production (needed at runtime) also
# applies during build, making pnpm skip devDependencies — which breaks the
# husky prepare hook and removes the build tooling (nest/next/codegen).

services:
  # ── Redis (BullMQ queues for AI event reactions) ────────────────────────
  - name: axis-kv
    type: keyvalue
    plan: free
    region: oregon
    ipAllowList: [] # internal connections only

  # ── Backend: NestJS GraphQL API ─────────────────────────────────────────
  - name: axis-lms-api
    type: web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter axis-backend build
    startCommand: pnpm --filter axis-backend start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Neon connection — values set in the dashboard, never committed.
      # Use the DIRECT host (no "-pooler"): migrations run on boot
      # (migrationsRun) and Neon advises direct connections for schema
      # migrations (neon.com/docs/connect/connection-pooling).
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: '5432'
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: REDIS_HOST
        fromService:
          name: axis-kv
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: axis-kv
          type: keyvalue
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://axis-lms-web.onrender.com
      - key: COOKIE_SAMESITE
        value: none
      # Set in the dashboard during blueprint creation (never committed).
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Frontend: Next.js ───────────────────────────────────────────────────
  - name: axis-lms-web
    type: web
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Codegen must run before build: the frontend imports from the
    # gitignored __generated__ dir (schema snapshot is tracked in-repo).
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter axis-frontend codegen && pnpm --filter axis-frontend build
    startCommand: pnpm --filter axis-frontend start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Inlined into the client bundle at BUILD time (see ci.yml note).
      - key: NEXT_PUBLIC_API_URL
        value: https://axis-lms-api.onrender.com/api
